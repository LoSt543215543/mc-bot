<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGLABS // Bot Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body {
      background: radial-gradient(circle at top, #14192b 0%, #090a0f 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: rgba(18, 22, 34, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; color: #ffffff; }
    label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 1.25rem;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #00e5ff; }
    button {
      width: 100%;
      padding: 12px;
      background: #00e5ff;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      color: #090a0f;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    #err { color: #f87171; font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Protected Gateway</div>
    <h2>ACCOUNT LOGIN</h2>
    
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required autofocus />
    
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required />
    
    <button onclick="login()">Sign In</button>
    <div id="err"></div>
  </div>

  <script>
    async function login() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('err');
      err.style.display = 'none';

      if (!u || !p) {
        err.style.display = 'block';
        err.innerText = 'Please enter both username and password.';
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/';
        } else {
          err.style.display = 'block';
          err.innerText = data.message || 'Invalid credentials.';
        }
      } catch (e) {
        err.style.display = 'block';
        err.innerText = 'Error connecting to authentication service.';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
